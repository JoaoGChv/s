<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Plataforma de Anotação Simples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #canvas {
            border: 1px solid black;
            cursor: crosshair;
            margin-top: 10px;
        }
        #coordinates {
            margin-top: 10px;
            font-weight: bold;
        }
        #labelForm {
            display: none;
            margin-top: 10px;
        }
        #labelForm select {
            padding: 5px;
            font-size: 16px;
        }
        #bboxFormatOptions {
            margin-top: 20px;
        }
        #bboxFormatOptions h3 {
            margin-bottom: 5px;
        }
        /* Estilos para o overlay de carregamento */
        #loadingOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        #loadingOverlay p {
            font-size: 24px;
            color: #000;
        }
    </style>
</head>
<body>

<h1>Plataforma de Anotação Simples</h1>

<label for="imageLoader">Carregar Imagem:</label>
<input type="file" id="imageLoader" name="imageLoader" accept="image/*"/>
<br>
<canvas id="canvas"></canvas>

<div id="coordinates">Coordenadas: </div>

<!-- Formulário para selecionar a label -->
<div id="labelForm">
    <label for="labelSelect">Label:</label>
    <select id="labelSelect">
        <option value="" disabled selected>Selecione uma label</option>
        <option value="0">Carro</option>
        <option value="1">Pessoa</option>
        <option value="2">Bicicleta</option>
        <option value="3">Sinalização</option>
        <option value="4">Árvore</option>
    </select>
</div>

<!-- Opções de formato de bounding box -->
<div id="bboxFormatOptions">
    <h3>Formato do Bounding Box:</h3>
    <input type="radio" id="format_yolo" name="bbox_format" value="yolo" checked>
    <label for="format_yolo">YOLO</label>
    <br>
    <input type="radio" id="format_xywh" name="bbox_format" value="xywh">
    <label for="format_xywh">xywh (x_min, y_min, width, height)</label>
    <br>
    <input type="radio" id="format_xyxy" name="bbox_format" value="xyxy">
    <label for="format_xyxy">xyxy (x_min, y_min, x_max, y_max)</label>
</div>

<!-- Botão para exportar as anotações -->
<button onclick="exportAnnotations()">Exportar Anotações</button>

<!-- Overlay de carregamento -->
<div id="loadingOverlay">
    <p id="loadingMessage">Carregando...</p>
</div>

<script>
    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');
    var imageLoader = document.getElementById('imageLoader');
    var img = new Image();

    var currentBoundingBox = null;
    var imageWidth = 0;
    var imageHeight = 0;

    // Elementos de carregamento
    var loadingOverlay = document.getElementById('loadingOverlay');
    var loadingMessage = document.getElementById('loadingMessage');

    // Elementos do formulário de label
    var labelForm = document.getElementById('labelForm');
    var labelSelect = document.getElementById('labelSelect');

    // Lista de anotações
    var annotations = [];

    // Carrega a imagem selecionada
    imageLoader.addEventListener('change', handleImage, false);

    function handleImage(e){
        var file = e.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function(event){
            img.onload = function(){
                canvas.width = img.width;
                canvas.height = img.height;
                imageWidth = img.width;
                imageHeight = img.height;
                ctx.drawImage(img, 0, 0);

                // Limpar anotações anteriores
                annotations = [];

                // Enviar a imagem ao servidor
                uploadImage(file);
            }
            img.src = event.target.result;
        }
        reader.readAsDataURL(file);

        // Mostrar overlay de carregamento
        showLoading('Carregando imagem...');
    }

    function uploadImage(file) {
        var formData = new FormData();
        formData.append('image', file);

        fetch('/upload_image', {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(data => {
            // Ocultar overlay de carregamento
            hideLoading();
            console.log('Imagem enviada com sucesso');
        })
        .catch(error => {
            hideLoading();
            console.error('Erro ao enviar a imagem:', error);
        });
    }

    // Obtém a posição do mouse relativa ao canvas
    function getMousePos(canvas, evt) {
        var rect = canvas.getBoundingClientRect();
        return {
            x: Math.round(evt.clientX - rect.left),
            y: Math.round(evt.clientY - rect.top)
        };
    }

    // Exibe as coordenadas do clique e envia ao servidor
    canvas.addEventListener('click', function(evt) {
        var mousePos = getMousePos(canvas, evt);
        var coordsDiv = document.getElementById('coordinates');
        coordsDiv.innerHTML = 'Coordenadas do Clique: ' +
            'X: ' + mousePos.x + ', Y: ' + mousePos.y;

        // Mostrar overlay de processamento
        showLoading('Processando segmentação...');

        // Esconder o formulário de label
        labelForm.style.display = 'none';

        // Enviar os dados ao servidor
        fetch('/process_point', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ x: mousePos.x, y: mousePos.y })
        })
        .then(response => response.json())
        .then(data => {
            // Ocultar overlay de carregamento
            hideLoading();

            if (data.error) {
                alert(data.error);
                return;
            }

            // Receber a imagem processada e exibi-la
            var imgResult = new Image();
            imgResult.onload = function() {
                // Atualizar o canvas com a nova imagem contendo todas as anotações
                ctx.drawImage(imgResult, 0, 0);
            };
            imgResult.src = 'data:image/png;base64,' + data.image;

            // Armazenar o bounding box atual
            currentBoundingBox = data.bbox;

            // Mostrar o formulário de label
            labelForm.style.display = 'block';
        })
        .catch(error => {
            hideLoading();
            console.error('Error:', error);
        });
    });

    // Funções para mostrar e ocultar o overlay de carregamento
    function showLoading(message) {
        loadingMessage.textContent = message;
        loadingOverlay.style.display = 'flex';
    }

    function hideLoading() {
        loadingOverlay.style.display = 'none';
    }

    // Evento para salvar a anotação quando a label é selecionada
    labelSelect.addEventListener('change', function() {
        var classNumber = labelSelect.value;
        var labelText = labelSelect.options[labelSelect.selectedIndex].text;
        if (classNumber === '') {
            alert('Por favor, selecione uma label.');
            return;
        }

        if (!currentBoundingBox) {
            alert('Nenhuma segmentação disponível.');
            return;
        }

        // Salvar a anotação localmente
        annotations.push({
            class_number: parseInt(classNumber),
            label: labelText,
            bbox: currentBoundingBox
        });

        // Enviar a label, número da classe e o bounding box ao servidor
        var data = {
            label: labelText,
            class_number: parseInt(classNumber),
            bbox: currentBoundingBox
        };

        fetch('/save_annotation', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            alert('Anotação salva com sucesso!');
            // Resetar o select da label
            labelSelect.selectedIndex = 0;
            // Esconder o formulário de label
            labelForm.style.display = 'none';
            // Limpar o bounding box atual
            currentBoundingBox = null;
        })
        .catch(error => {
            console.error('Erro ao salvar a anotação:', error);
        });
    });

    // Função para exportar as anotações com o formato selecionado
    function exportAnnotations() {
        // Obter o formato selecionado
        var format = document.querySelector(
            'input[name="bbox_format"]:checked').value;

        // Enviar requisição ao servidor para exportar as anotações
        fetch('/export_annotations?format=' + format)
            .then(response => {
                if (response.ok) {
                    return response.blob();
                } else {
                    return response.json().then(err => {
                        throw new Error(err.error);
                    });
                }
            })
            .then(blob => {
                // Criar um link para download
                var url = window.URL.createObjectURL(blob);
                var a = document.createElement('a');
                a.href = url;
                if (format === 'yolo') {
                    a.download = 'annotations.txt';
                } else {
                    a.download = 'annotations.json';
                }
                document.body.appendChild(a);
                a.click();
                a.remove();
            })
            .catch(error => {
                alert('Erro ao exportar as anotações: ' +
                      error.message);
            });
    }
</script>

</body>
</html>
